<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Team Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        // 1. Import Mermaid Core (Using v10.9.0 for better stability)
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.esm.min.mjs';
        
        // 2. Import ELK Layout (Required for Adaptive Mode)
        import elkLayouts from 'https://cdn.jsdelivr.net/npm/@mermaid-js/layout-elk@0.1.4/dist/mermaid-layout-elk.esm.min.mjs';

        // 3. Register ELK
        mermaid.registerLayoutLoaders(elkLayouts);

        // 4. Initialize
        mermaid.initialize({ 
            startOnLoad: false, 
            layout: 'elk', 
            theme: 'dark',
            securityLevel: 'loose',
            elk: {
                mergeEdges: true,
                nodePlacementStrategy: 'NETWORK_SIMPLEX',
            }
        });
        window.mermaid = mermaid;
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #1a1a1a; color: #e5e5e5; font-family: 'Segoe UI', sans-serif; }
        #diagram-container { width: 100%; height: 85vh; overflow: auto; cursor: grab; display: flex; justify-content: center; }
        /* Badge Styling */
        .status-badge rect { fill-opacity: 1; stroke: none; }
        .node { cursor: pointer; }
        .node:hover { opacity: 0.8; transition: 0.2s; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <div id="loginOverlay" class="fixed inset-0 bg-neutral-900 z-50 flex items-center justify-center">
        <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-96 border border-gray-600 text-center">
            <div class="mb-6">
                <i class="fas fa-drone text-green-500 text-4xl mb-2"></i>
                <h2 class="text-2xl font-bold text-white">Team Access</h2>
            </div>
            <select id="userSelect" class="w-full bg-gray-700 text-white border border-gray-600 rounded p-3 mb-4">
                <option value="" disabled selected>Select User...</option>
                <option value="Palash">Palash</option>
                <option value="Mihir">Mihir</option>
                <option value="Divyang">Divyang</option>
                <option value="Admin">Admin</option>
                <option value="Prabhuparth">Prabhuparth</option>
            </select>
            <div id="repoConfigArea" class="hidden text-left mb-4">
                <p class="text-xs text-yellow-500 mb-2">First time setup required.</p>
                <input id="login-owner" type="text" placeholder="GitHub Username" class="w-full bg-gray-700 border border-gray-600 p-2 rounded mb-2 text-sm">
                <input id="login-repo" type="text" placeholder="Repository Name" class="w-full bg-gray-700 border border-gray-600 p-2 rounded mb-2 text-sm">
                <input id="login-token" type="password" placeholder="GitHub Token" class="w-full bg-gray-700 border border-gray-600 p-2 rounded mb-2 text-sm">
            </div>
            <button onclick="attemptLogin()" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded transition">Enter</button>
        </div>
    </div>

    <nav class="bg-gray-800 p-4 border-b border-gray-700 flex justify-between items-center z-10">
        <div class="font-bold text-xl flex items-center gap-2"><i class="fas fa-project-diagram text-green-500"></i><span>Progress Board</span></div>
        <div class="flex items-center gap-4">
            <span id="currentUserDisplay" class="text-sm text-gray-400 font-mono border border-gray-600 px-2 py-1 rounded"></span>
            <button id="saveBtn" onclick="saveToGitHub()" class="bg-blue-600 hover:bg-blue-700 px-4 py-1 rounded text-sm transition hidden"><i class="fas fa-save mr-1"></i> Save</button>
            <button onclick="logout()" class="text-red-400 hover:text-red-300 text-sm"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </nav>

    <div id="diagram-container" class="bg-neutral-900 relative">
        <div id="mermaid-graph" class="w-full h-full flex justify-center p-10"></div>
    </div>

    <div id="editModal" class="fixed inset-0 bg-black bg-opacity-70 hidden flex items-center justify-center z-40">
        <div class="bg-gray-800 p-6 rounded-lg shadow-xl w-80 border border-gray-600">
            <h3 class="text-lg font-bold mb-4" id="modalTitle">Edit Node</h3>
            <input type="range" id="progressInput" min="0" max="100" class="w-full h-2 bg-gray-600 rounded-lg appearance-none cursor-pointer mb-2">
            <div class="text-center font-mono text-2xl text-green-400 mb-4"><span id="progressVal">0</span>%</div>
            <textarea id="noteInput" class="w-full bg-gray-700 rounded p-2 text-sm mb-4 text-white" rows="3" placeholder="Notes..."></textarea>
            <div class="flex justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-2 bg-gray-600 rounded hover:bg-gray-500 text-white">Cancel</button>
                <button onclick="updateNodeData()" class="px-4 py-2 bg-green-600 rounded hover:bg-green-500 text-white">Update</button>
            </div>
        </div>
    </div>

    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.esm.min.mjs';

        // --- FIXED GRAPH DEFINITION ---
        // 1. Removed %%init%%
        // 2. Expanded all '&' to separate arrows
        // 3. Fixed label syntax to -->|Label|
        // 4. Removed @{shape} and classDefs
        const graphDefinition = `
flowchart TB
 subgraph s2["Path Planning Module"]
        n8["Global Probability Grid"]
        n9["Error and Safety distribution in Grid"]
        n10["Planning Module"]
        n12["Broadest Safe Corridor Finding"]
  end
 subgraph s3["Single Drone Autonomous"]
        n25["Autonomous Drone Scripting"]
        n26["Simulation Check"]
        n27["Works ?"]
        n28["Loiter Mode Drone Testing"]
        n29["Works ?"]
  end
 subgraph s4["Complex Movement Scripting"]
        n31["Autonomous Drone Scripting"]
        n32["Simulation Check"]
        n33["Works ?"]
        n34["Loiter Mode Drone Testing"]
        n35["Works ?"]
  end
 subgraph s5["Detection Sensor"]
        n2["Logical Section"]
        SENSOR_STACK["Stack of images from Thermal Sensor"]
        SPIRAL["Image Processing and Detection Algorithms"]
        THERMAL_MOD["Thermal mine detection"]
        n3["RGC Camera"]
        n4["Movement Function to Decrease Error in Images"]
  end
 subgraph s6["Master Slave Prototype"]
        n47["Master Slave Prototyping"]
        n48["Scripting"]
        n49["Simulation"]
        n50["Loiter"]
  end

    FINAL_PRODUCT(["Start"]) --> HW_ZERO["Zero Drone"]
    FINAL_PRODUCT --> s5
    FINAL_PRODUCT --> n41["Drone Communication Sensors"]
    FINAL_PRODUCT --> n42["Building Other Drones"]

    HW_ZERO --> HW_BORROW["Borrowed Drone"]
    HW_BORROW --> HW_FLASH["Flashing and Scripting"]
    HW_FLASH --> HW_RPI["RPi and other connections"]
    HW_RPI --> n24["Single Drone Flight Testing"]
    
    SENSOR_STACK --> SPIRAL
    THERMAL_MOD --> SENSOR_STACK
    
    PROC_INFO["Processed Information from sensor module"] --> PARAM["Simplistic parameter conversion"]
    PROC_INFO --> n6["Memory Module"]
    
    n2 --> THERMAL_MOD
    n2 --> n3
    n3 --> n4
    n4 --> SPIRAL
    SPIRAL --> n5["Verification Layer"]
    n5 --> PROC_INFO
    
    n6 --> n7["A4 Paper Hint Check Module"]
    n6 --> n8
    n7 --> n5
    n8 --> n9
    n9 --> n10
    n10 --> n12
    
    n24 --> s3
    n25 --> n26
    n26 --> n27
    n27 --> n28
    n27 --> n25
    n28 --> n29
    n29 --> n25
    
    s3 --> n30["Branching"]
    n31 --> n32
    n32 --> n33
    n33 -->|Yes| n34
    n33 -->|No| n31
    n34 --> n35
    n35 -->|No| n31
    
    n30 --> n36["Two Drone Simulation"]
    n30 --> s4
    n30 --> n54["Black Box Creation"]
    
    n36 --> n37["Simple Movement Script"]
    n37 -.-> n36
    n37 --> n38["Loiter Mode Two Drone Script Test"]
    n38 --> n39["Complex two Drone Movements"]
    n38 --> n40["Drone to Drone Communication"]
    
    s4 --> n39
    n41 --> n40
    n42 --> n38
    n40 --> n46["Two Drone Communication Testing"]
    n40 -.-> n53["Time Synchronization (NTP)"]
    
    n43["Data Transfer Pipeline"] --> n45["Swarm Coordination and Data Transfer"]
    n46 --> n43
    n47 --> n48
    n48 --> n49
    n49 --> n50
    n50 --> n48
    n39 --> n51["Master Slave Drone Movements"]
    n45 --> s6
    s6 --> n51
    n51 --> n52["Scaling"]
    n52 -.-> s6
    s2 --> n41
    
    PARAM --> n41
    PARAM --> n55["Sensor Data Integration"]
    n53 -.-> n46
    n52 --> n55
    n55 --> n56["Prototype"]

    style FINAL_PRODUCT fill:#000,stroke:#f97316,stroke-width:4px,color:#fff
    style n41 fill:#424242,color:#FFFFFF,stroke:#00C853
    style n6 stroke:#FFD600,fill:#424242,color:#FFFFFF
    style s3 stroke:#00C853
    style n56 stroke:#D50000,color:#FFFFFF,fill:#424242
        `;

        // --- APP LOGIC (Unchanged but sanitized) ---
        let appData = {};
        let currentSha = null;
        let activeNodeId = null;
        let activeUser = null;
        const FILE_PATH = "progress.json";

        const renderGraph = async () => {
            const element = document.querySelector("#mermaid-graph");
            try {
                const { svg } = await mermaid.render('mermaid-svg', graphDefinition);
                element.innerHTML = svg;
                attachInteractivity();
                if(Object.keys(appData).length > 0) applyVisualState();
            } catch (error) {
                console.error(error);
                element.innerHTML = `<div class="text-red-500 p-4">Syntax Error: ${error.message}</div>`;
            }
        };

        const attachInteractivity = () => {
            document.querySelectorAll('.node').forEach(node => {
                node.addEventListener('click', (e) => {
                    // Robust ID extraction
                    const parts = node.id.split('-');
                    // We look for parts that match our node IDs (e.g. n31, n2)
                    // The mermaid ID is usually "flowchart-n31-..."
                    let rawId = parts[1]; 
                    openEditModal(rawId);
                });
            });
        };

        const applyVisualState = () => {
            document.querySelectorAll('g.status-badge').forEach(el => el.remove());
            Object.keys(appData).forEach(id => {
                const percentage = appData[id].progress || 0;
                // Loose matching for ID to handle mermaid generation variations
                const nodeEl = document.querySelector(`[id*="-${id}-"]`) || document.querySelector(`[id*="-${id}"]`);
                
                if (nodeEl) {
                    let color = '#fff';
                    if (percentage > 0) color = '#facc15';
                    if (percentage == 100) color = '#4ade80';

                    const shape = nodeEl.querySelector('rect, polygon, circle, path');
                    if(shape) {
                        if(!shape.dataset.originalStroke) shape.dataset.originalStroke = getComputedStyle(shape).stroke;
                        shape.style.stroke = color;
                        shape.style.strokeWidth = percentage > 0 ? "4px" : "1px";
                    }

                    if (percentage > 0) {
                        const bbox = nodeEl.getBBox();
                        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                        g.setAttribute("class", "status-badge");
                        g.setAttribute("transform", `translate(${bbox.width/2 - 15}, ${bbox.height + 10})`);
                        g.innerHTML = `
                            <rect width="30" height="14" rx="4" fill="${color}" stroke="none"></rect>
                            <text x="15" y="10" text-anchor="middle" font-size="9" fill="#000" font-weight="bold">${percentage}%</text>
                        `;
                        nodeEl.appendChild(g);
                    }
                }
            });
        };

        // --- AUTH & GITHUB ---
        document.getElementById('userSelect').addEventListener('change', function() {
            const user = this.value;
            const storedConfig = localStorage.getItem(`config_${user}`);
            const configArea = document.getElementById('repoConfigArea');
            if (storedConfig) configArea.classList.add('hidden');
            else configArea.classList.remove('hidden');
        });

        window.attemptLogin = async () => {
            const user = document.getElementById('userSelect').value;
            if(!user) return alert("Select user");
            const configArea = document.getElementById('repoConfigArea');
            let owner, repo, token;

            if (!configArea.classList.contains('hidden')) {
                owner = document.getElementById('login-owner').value;
                repo = document.getElementById('login-repo').value;
                token = document.getElementById('login-token').value;
                if (!owner || !repo || !token) return alert("Fill all fields");
                localStorage.setItem(`config_${user}`, JSON.stringify({ owner, repo, token }));
            } else {
                const config = JSON.parse(localStorage.getItem(`config_${user}`));
                owner = config.owner; repo = config.repo; token = config.token;
            }

            const success = await loadFromGitHub(owner, repo, token);
            if(success) {
                activeUser = user;
                document.getElementById('currentUserDisplay').innerHTML = `<i class="fas fa-user mr-2"></i>${user}`;
                document.getElementById('loginOverlay').classList.add('hidden');
            }
        };

        window.logout = () => location.reload();

        async function loadFromGitHub(owner, repo, token) {
            try {
                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${FILE_PATH}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if(response.ok) {
                    const json = await response.json();
                    currentSha = json.sha;
                    appData = JSON.parse(atob(json.content));
                    applyVisualState();
                    return true;
                } else if(response.status === 404) {
                    currentSha = null; appData = {};
                    return true;
                }
                alert("GitHub Error: " + response.statusText); return false;
            } catch(e) { alert("Network Error"); return false; }
        }

        window.saveToGitHub = async () => {
            const config = JSON.parse(localStorage.getItem(`config_${activeUser}`));
            const content = btoa(JSON.stringify(appData, null, 2));
            const body = { message: `Update by ${activeUser}`, content: content };
            if(currentSha) body.sha = currentSha;

            try {
                const response = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/${FILE_PATH}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${config.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if(response.ok) {
                    const json = await response.json();
                    currentSha = json.content.sha;
                    document.getElementById('saveBtn').classList.add('hidden');
                    alert(`Saved!`);
                } else { alert("Save failed."); }
            } catch(e) { console.error(e); }
        };

        // --- EDITING ---
        window.openEditModal = (id) => {
            activeNodeId = id;
            const data = appData[id] || { progress: 0, note: '' };
            document.getElementById('modalTitle').innerText = `${id}`;
            document.getElementById('progressInput').value = data.progress;
            document.getElementById('progressVal').innerText = data.progress;
            document.getElementById('noteInput').value = data.note || '';
            document.getElementById('editModal').classList.remove('hidden');
        };
        window.closeModal = () => document.getElementById('editModal').classList.add('hidden');
        window.updateNodeData = () => {
            appData[activeNodeId] = {
                progress: parseInt(document.getElementById('progressInput').value),
                note: document.getElementById('noteInput').value,
                lastEditor: activeUser
            };
            closeModal();
            applyVisualState();
            document.getElementById('saveBtn').classList.remove('hidden');
        };

        document.getElementById('progressInput').addEventListener('input', (e) => {
            document.getElementById('progressVal').innerText = e.target.value;
        });

        renderGraph();
    </script>
</body>
</html>
